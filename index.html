
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#593b2b">
    <title>MetroCards</title>

    <link rel="stylesheet" href="style.css">
    <script src="cards.js" defer></script>
    <script src="pack.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1>MetroCards</h1>
    </header>

    <main class="container">
        <section class="opening-section">
            <h2>Open a Pack</h2>
            <p class="subtitle" id="pack-instructions">
                Ready to see what you pull?
            </p>

            <!-- Pack image / stacked cards / revealed card -->
            <div class="pack-display" id="pack-display">
                <img
                    id="pack-image"
                    src="cards/pack.png"
                    alt="MetroCards pack"
                >

                <div
                    id="card-stack"
                    class="card-stack"
                    role="group"
                    aria-label="Cards in your pack"
                    hidden
                ></div>

                <div id="current-card" class="current-card" hidden></div>
            </div>

            <button id="pack-button" type="button">
                Open Pack
            </button>

            <p id="pack-status" class="pack-status" aria-live="polite"></p>

            <div
                id="revealed-cards"
                class="card-grid revealed-grid"
                aria-label="Your four cards"
            ></div>

            <button
                id="another-pack-button"
                class="secondary-button"
                type="button"
                hidden
            >
                Open Another Pack
            </button>
        </section>

        <section class="collection-section">
            <h2>Your Collection</h2>
            <p class="subtitle">
                Every card you pull will be saved here for this session.
            </p>

            <p id="collection-count" class="collection-count">
                0 cards collected
            </p>

            <div
                id="collection"
                class="card-grid collection-grid"
                aria-label="Your card collection"
            >
                <p class="empty-message">
                    Your collection is empty. Open a pack to get started!
                </p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        MetroCards
    </footer>
</body>
</html>
